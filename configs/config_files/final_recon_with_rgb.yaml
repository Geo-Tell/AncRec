method: anchorrec
resume: False
finetune: True
weight: ['ckpts/only_detection.pth','ckpts/detection_refine.pth', 'ckpts/resnet_pointnet_with_rgb.pth']
bsp_weight: './datasets/BSP_AE.model64.pth' ##原始BSPNet(3DCNN)权重
use_rgb: True
seed: 10
multiple_gpus: False
device:
  use_gpu: True
  gpu_ids: '1'
  num_workers: 1
data:
  dataset: scannet
  split: /home/dmy/data/datasets/scannet/splits/fullscan/original #
  num_target: 64
  pretrained_features_pth: 'datasets/latentz.pkl'
  shapenet_path: /data/dong/anchorrec/ShapeNetv2_data
  output_gt_z_mesh: False #True
  point_recall_thresh: 0.2
  point_precision_thresh: 0.2
  objectness_thresh: 0.05
  use_rgb: True
  mincount: 40
  maxcount: 250 #500
  conf_thresh: 0.5 # 0.5
  num_point: 80000
  no_height: False
model:
  backbone:
    method: Pointnet2Backbone
  detection:
    method: ProposalModule
    num_proposal: 256
    cluster_sampling: vote_fps
    num_sample: 16
    shape:
      residual: true
      scale: 1.0
      subnetworks: 1
      supervise: True
      use_gt_anchors: False
      wd0: 1.0
      wd1: 1.0
      wd2: 1.0
  detection_head:
    method: FusionPredictHead_no_rgb
    proposal_feat_channels: 128
    hidden_dim: 128
    use_anchor: True
    loss: DetectionLoss
  quad_detection:
    iou_threshold: 0.05
    loss: QuadDetectionLoss
    method: QuadProposalModule
    num_sample: 32
    sa: true # False #true
    shape:
      subnetworks: 3
      scale: 1.0
      residual: True
      supervise: True #False #True
      wd0: 1.0
      wd1: 1.0
      wd2: 1.0
  GenerateInstanceFeat:
    method: InstanceFeatSampling
    sample_radius: 0.1
    nsample: [ 30,5 ]
    min_num_pts: 20
    rescale_range: [ 0.7, 1.3 ]
    shift_range: [ -10,10 ]
    image_size: 256 #400
    min_pts2d_range: 20
  img_encoder:
    method: ResNet_fpn
    frozen_stages: 2
    use_point_mask: False
    out_channels: 256
  detection_refine_head:
    method: FusionPredictHead
    rgb_input_channels: 256
    hidden_dim: 128
  feature_encode:
    method: ResnetPointnet #2
    c_dim: 256
    hidden_dim: 512
    proposal_feature_dim: 256
    use_proposal_features: True
    use_rgb_features: True
    rgb_feature_dim: 256
    loss: FeatureEncodeLoss
  completion:
    method: BSPNet
    mode: generate
    phase: 1
    feature_matching: True
    finetune_decoder: False
    weight: 1
    sample_vox_size: 16
    loss: null
demo:
  phase: 'final_recon_with_rgb'
  use_cls_nms: True
  use_3d_nms: True
  remove_empty_box: True
  remove_under_floor: True
  nms_iou: 0.25
  use_old_type_nms: False
  dump_thresh: 0.5
  per_class_proposal: True
log:
  vis_path: visualization
  save_results:  False
  vis_step_val: 30
  vis_step_train: 30
  vis_step_epoch: 5
  vis_start_epoch: 10
  print_step: 10
  path: out/recon_all_rgb
  vis_scan_names: all # ["scene0378_02"]
