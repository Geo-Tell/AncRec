method: anchorrec_rgb_classify
resume: False
finetune: False #
weight: []
seed: 10
multiple_gpus: False
device:
  use_gpu: True
  gpu_ids: '2'
  num_workers: 0
data:
  dataset: RGB_GT
  image_size: 256
model:
  img_encoder:
    method: ResNet_fpn
    frozen_stages: 2
    use_point_mask: False
    out_channels: 256
optimizer:
  method: Adam
  lr: 1e-3
  betas: [0.5, 0.999]
  eps: 1e-08
  weight_decay: 0.0005
  grad_norm_clip: 10
scheduler: #
  method: Exponential
#  patience: 10 #20
#  factor: 0.1
#  threshold: 0.01
train:
  epochs: 50 #100
  freeze: []
  batch_size: 128
val:
  batch_size: 128
log:
  vis_path: visualization
  save_results: False
  print_step: 10
  path: out/rgb_pretrain #/no_fpn